[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firefox-stealth-automation"
version = "1.1.0"
description = "Undetected Gecko Automation Framework & Project-Isolated Browser Profile Suite for Mozilla Firefox"
readme = "README.md"
authors = [{ name = "Ulul Azmi" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "firefox",
    "stealth",
    "automation",
    "marionette",
    "anti-bot",
    "bot-detection",
    "gecko",
    "playwright",
    "browser-profile",
    "isolated-profile",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "rich>=13.0.0",
    "curl_cffi>=0.7.0",
    "playwright>=1.40.0",
]

[project.scripts]
firefox-stealth = "firefox_stealth.cli:main"

[project.urls]
Homepage = "https://github.com/ululazmi18/firefox-stealth-automation"
Repository = "https://github.com/ululazmi18/firefox-stealth-automation.git"
Issues = "https://github.com/ululazmi18/firefox-stealth-automation/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["firefox_stealth*"]

[tool.setuptools.package-data]
firefox_stealth = ["stealth_addon/*"]
